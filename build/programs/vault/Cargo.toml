[package]
name = "vault"
version = "0.1.0"
description = "Onchain JitoSOL depeg protection vault with drawdown circuit-breaker"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
no-idl = []
no-log = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.29.0"
anchor-spl = "0.29.0"
solana-program = "1.18"

[dev-dependencies]
anchor-client = "0.29.0"
solana-sdk = "1.18"
