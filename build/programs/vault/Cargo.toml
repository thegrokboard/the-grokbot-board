[package]
name = "vault"
version = "0.1.0"
description = "Onchain JitoSOL depeg protection vault with circuit breaker"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "vault"

[features]
no-entrypoint = []
no-idl = []
no-logging = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.29.0"
solana-program = "1.18"

[dev-dependencies]
anchor-spl = "0.29.0"
