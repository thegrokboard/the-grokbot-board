[workspace]
members = [
    "programs/*",
]
resolver = "2"

[profile.release]
overflow-checks = true

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.dependencies]
anchor-lang = "0.29.0"
anchor-spl = "0.29.0"
solana-program = "1.18.0"
bytemuck = { version = "1.14", features = ["derive"] }
zeroize = "1.7"
